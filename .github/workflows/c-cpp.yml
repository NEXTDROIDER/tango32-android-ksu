name: Tango32 ARM64 kernel module build

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: Kernel repository (owner/name)
        required: true
        default: oppo-source/android_kernel_oppo_sm6225
        type: string
      kernel_branch:
        description: Kernel branch to compile against
        required: true
        default: oppo/sm6225_b_16.0
        type: string
      device_model:
        description: Phone/device model label for release
        required: true
        default: OPPO CPH2819
        type: string
      delay_minutes:
        description: Optional wait before starting (0-60 minutes)
        required: false
        default: "0"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Tango32
        uses: actions/checkout@v4

      - name: Optional delay
        env:
          DELAY: ${{ inputs.delay_minutes }}
        run: |
          if ! [[ "$DELAY" =~ ^[0-9]+$ ]] || [ "$DELAY" -gt 60 ]; then
            echo "delay_minutes must be an integer from 0 to 60"
            exit 1
          fi
          if [ "$DELAY" -gt 0 ]; then
            sleep "$((DELAY * 60))"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential git libssl-dev libelf-dev dwarves python3 perl make clang lld llvm

      - name: Clone selected kernel source
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        run: |
          if ! [[ "$KERNEL_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid repo format"
            exit 1
          fi
          git clone --depth=1 --single-branch --branch "$KERNEL_BRANCH" "https://github.com/$KERNEL_REPO.git" kernel
          echo "Kernel commit: $(git -C kernel rev-parse HEAD)"

      - name: Disable unavailable vendor Kconfig includes (Bash only)
        run: |
          set -euo pipefail
          cd kernel
          for file in init/Kconfig drivers/soc/Kconfig mm/Kconfig kernel/Kconfig.locks drivers/power/Kconfig drivers/android/Kconfig drivers/input/Kconfig drivers/input/touchscreen/Kconfig kernel/oplus_cpu/Kconfig; do
            [ -f "$file" ] || continue
            tmp="$(mktemp)"
            while IFS= read -r line || [ -n "$line" ]; do
              trimmed="$(printf '%s' "$line" | sed -E 's/^[[:space:]]+//')"
              directive="$(printf '%s' "$trimmed" | cut -d ' ' -f1)"
              case "$directive" in
                source|rsource|osource|orsource)
                  target="$(printf '%s' "$trimmed" | sed -n 's/^[^"]*"\([^"]*\)".*/\1/p')"
                  if [ -n "$target" ] && case "$target" in *'$'*) false ;; *) true ;; esac && [ ! -f "$target" ]; then
                    printf '# CI compile-check skipped missing include: %s\n' "$line" >> "$tmp"
                    continue
                  fi
                  ;;
              esac
              printf '%s\n' "$line" >> "$tmp"
            done < "$file"
            if ! cmp -s "$file" "$tmp"; then
              cat "$tmp" > "$file"
              echo "Patched missing Kconfig includes in $file"
            fi
            rm -f "$tmp"
          done
          if grep -nE '^[[:space:]]*(source|rsource|osource|orsource)[[:space:]]+"kernel/oplus_cpu/sched/Kconfig"' init/Kconfig; then
            echo "Missing include remains active"
            exit 1
          fi

      - name: Configure ARM64 kernel for compile-check
        run: |
          cd kernel
          make ARCH=arm64 LLVM=1 defconfig
          scripts/config --enable FUTEX
          scripts/config --enable COMPAT
          scripts/config --enable MODULES
          scripts/config --disable MODVERSIONS
          make ARCH=arm64 LLVM=1 olddefconfig
          make ARCH=arm64 LLVM=1 modules_prepare
          make ARCH=arm64 LLVM=1 kernelrelease > ../kernel-release.txt
          grep -E 'CONFIG_(FUTEX|COMPAT|MODULES|MODVERSIONS)=' .config || true
          cp .config ../kernel-config.txt

      - name: Build Tango32 module (compile-check)
        run: |
          make -C kernel M="$GITHUB_WORKSPACE" ARCH=arm64 LLVM=1 CONFIG_TANGO32=m W=1 modules

      - name: Collect diagnostics
        if: always()
        run: |
          {
            echo "Kernel repository: ${{ inputs.kernel_repo }}"
            echo "Device model: ${{ inputs.device_model }}"
            echo "Kernel branch: ${{ inputs.kernel_branch }}"
            echo "Kernel commit:"
            git -C kernel rev-parse HEAD 2>/dev/null || true
            echo "Kernel release:"
            cat kernel-release.txt 2>/dev/null || true
            echo "Compiler:"
            clang --version 2>/dev/null || true
            echo "Module files:"
            find . -maxdepth 3 -name '*.ko' -print
          } > build-info.txt
          cp kernel/.config kernel-config.txt 2>/dev/null || true

      - name: Create separate releases for each detected OPPO board
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          DEVICE_MODEL: ${{ inputs.device_model }}
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        run: |
          set -euo pipefail
          test -f tango32.ko || { echo "ERROR: tango32.ko missing; refusing to publish"; exit 1; }
          KERNEL_COMMIT="$(git -C kernel rev-parse HEAD)"
          KERNEL_SHORT="${KERNEL_COMMIT:0:8}"
          KERNEL_RELEASE="$(cat kernel-release.txt)"
          mkdir -p release-assets
          cp tango32.ko build-info.txt kernel-release.txt kernel-config.txt release-assets/
          tar -czf release-assets/tango32-build-bundle.tar.gz -C release-assets tango32.ko build-info.txt kernel-release.txt kernel-config.txt

          if [ "$DEVICE_MODEL" = "all" ]; then
            : > device-models.txt
            for base in kernel/arch/arm64/boot/dts kernel/arch/arm/boot/dts; do
              [ -d "$base" ] || continue
              find "$base" -type f -name '*.dts' -print0 |
              while IFS= read -r -d '' file; do
                # Match OPPO/OPlus in the actual compatible property, not comments or unrelated text.
                if ! grep -Eiq '^[[:space:]]*compatible[[:space:]]*=.*(oppo|oplus)' "$file"; then
                  continue
                fi
                # Do not classify OnePlus, Toradex, Valve, etc. as OPPO.
                COMPAT="$(grep -E '^[[:space:]]*compatible[[:space:]]*=' "$file" | head -n1 || true)"
                if printf '%s' "$COMPAT" | grep -Eiq 'oneplus|toradex|valve'; then
                  continue
                fi
                MODEL="$(grep -Eo '^[[:space:]]*model[[:space:]]*=[[:space:]]*"[^"]+"' "$file" | head -n1 | sed -E 's/^[[:space:]]*model[[:space:]]*=[[:space:]]*"//; s/"$//')"
                if [ -z "$MODEL" ]; then
                  MODEL="$(basename "$file" .dts)"
                fi
                printf '%s\n' "$MODEL"
              done
            done | sed '/^[[:space:]]*$/d' | sort -u > device-models.txt
            if [ ! -s device-models.txt ]; then
              echo "No OPPO/OPlus board DTS detected from compatible properties."
              exit 1
            fi
            echo "Detected OPPO board models:"
            cat device-models.txt
          else
            printf '%s\n' "$DEVICE_MODEL" > device-models.txt
          fi

          while IFS= read -r MODEL || [ -n "$MODEL" ]; do
            [ -n "$MODEL" ] || continue
            MODEL_SLUG="$(printf '%s' "$MODEL" | sed -E 's/[^A-Za-z0-9]+/-/g; s/^-|-$//g' | tr '[:upper:]' '[:lower:]')"
            RELEASE_SLUG="$(printf '%s' "$KERNEL_RELEASE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9.+_-]+/-/g')"
            TAG="tango32-${MODEL_SLUG}-${RELEASE_SLUG}-${KERNEL_SHORT}"
            TITLE="Tango32 · ${MODEL} · ${KERNEL_RELEASE} (${KERNEL_SHORT})"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release already exists, skipping: $TAG"
              continue
            fi
            NOTES="$(printf '%s\n'               '## Build details'               "- **Device model:** $MODEL"               "- **Kernel source:** $KERNEL_REPO"               "- **Branch:** $KERNEL_BRANCH"               "- **Kernel commit:** $KERNEL_COMMIT"               "- **Kernel release:** $KERNEL_RELEASE"               '- **Compiler:** Clang/LLVM (GitHub Actions)'               ''               '## Compatibility notice'               'Detected from OPPO/OPlus device-tree compatible properties. The module is compiled once for the selected kernel branch, not independently per model. Load only with a matching kernel config, headers, symbol versions and toolchain.'               ''               '## Assets'               'tango32.ko, build metadata/configuration, and bundle archive.')"
            gh release create "$TAG" release-assets/* --title "$TITLE" --notes "$NOTES"
            echo "Published release: $TAG"
          done < device-models.txt

          {
            echo "Detected OPPO device models:"
            cat device-models.txt
          } >> build-info.txt
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tango32-compile-check
          path: |
            *.ko
            build-info.txt
            kernel-release.txt
            kernel-config.txt
          if-no-files-found: warn
          retention-days: 14
