name: Tango32 Android ARM64

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ARCH: arm64
      LLVM: 1

    steps:
      - name: Checkout Tango32
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            python3 \
            python3-pip \
            clang \
            lld \
            llvm

      - name: Clone Android kernel
        run: |
          git clone --depth=1 \
            https://github.com/torvalds/linux.git \
            kernel

      - name: Configure kernel
        run: |
          cd kernel

          make ARCH=arm64 LLVM=1 defconfig

          scripts/config \
            --file .config \
            -m TANGO32

          make ARCH=arm64 LLVM=1 olddefconfig

          make ARCH=arm64 LLVM=1 modules_prepare

      - name: Build Tango32
        run: |
          make \
            KERNEL_SRC="$GITHUB_WORKSPACE/kernel" \
            M="$GITHUB_WORKSPACE" \
            ARCH=arm64 \
            LLVM=1 \
            modules

      - name: Find module
        run: |
          find . -type f -name "*.ko"

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: tango32-android-arm64
          path: "**/*.ko"
          if-no-files-found: error
          retention-days: 30
