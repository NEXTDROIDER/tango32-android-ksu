name: Tango32 ARM64 kernel module build

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: Kernel repository (owner/name)
        required: true
        default: oppo-source/android_kernel_oppo_sm6225
        type: string
      kernel_branch:
        description: Kernel branch to compile against
        required: true
        default: oppo/sm6225_b_16.0
        type: string
      device_model:
        description: Device model, or "all" to detect OPPO/OPlus boards
        required: true
        default: OPPO CPH2819
        type: string
      delay_minutes:
        description: Optional wait before starting (0-60 minutes)
        required: false
        default: "0"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Tango32
        uses: actions/checkout@v4

      - name: Optional delay
        env:
          DELAY: ${{ inputs.delay_minutes }}
        run: |
          if ! [[ "$DELAY" =~ ^[0-9]+$ ]] || [ "$DELAY" -gt 60 ]; then
            echo "delay_minutes must be an integer from 0 to 60"
            exit 1
          fi
          if [ "$DELAY" -gt 0 ]; then
            sleep "$((DELAY * 60))"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential git libssl-dev libelf-dev dwarves perl make clang lld llvm

      - name: Clone selected kernel source
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        run: |
          set -euo pipefail
          if ! [[ "$KERNEL_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid kernel repository format"
            exit 1
          fi
          git clone --depth=1 --single-branch --branch "$KERNEL_BRANCH" "https://github.com/$KERNEL_REPO.git" kernel
          echo "Kernel commit: $(git -C kernel rev-parse HEAD)"

      - name: Disable missing vendor Kconfig includes
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          for file in init/Kconfig drivers/soc/Kconfig mm/Kconfig kernel/Kconfig.locks drivers/power/Kconfig drivers/android/Kconfig drivers/input/Kconfig drivers/input/touchscreen/Kconfig kernel/oplus_cpu/Kconfig; do
            [ -f "$file" ] || continue
            tmp="$(mktemp)"
            while IFS= read -r line || [ -n "$line" ]; do
              trimmed="$(printf '%s' "$line" | sed 's/^[[:space:]]*//')"
              case "$trimmed" in
                source\ *|rsource\ *|osource\ *|orsource\ *)
                  target="$(printf '%s' "$trimmed" | sed -n 's/^[^"]*"\([^"]*\)".*/\1/p')"
                  case "$target" in
                    *'$'*) ;;
                    *)
                      if [ -n "$target" ] && [ ! -f "$target" ]; then
                        printf '# CI skipped missing Kconfig include: %s\n' "$line" >> "$tmp"
                        continue
                      fi
                      ;;
                  esac
                  ;;
              esac
              printf '%s\n' "$line" >> "$tmp"
            done < "$file"
            if ! cmp -s "$file" "$tmp"; then
              cat "$tmp" > "$file"
              echo "Patched missing includes in $file"
            fi
            rm -f "$tmp"
          done

      - name: Configure ARM64 kernel
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          make ARCH=arm64 LLVM=1 defconfig
          scripts/config --enable MODULES
          scripts/config --enable FUTEX
          scripts/config --enable COMPAT
          scripts/config --enable 64BIT
          scripts/config --disable MODVERSIONS
          make ARCH=arm64 LLVM=1 olddefconfig

          grep -q '^CONFIG_64BIT=y$' .config || { echo "CONFIG_64BIT is not enabled"; exit 1; }
          grep -q '^CONFIG_MODULES=y$' .config || { echo "CONFIG_MODULES is not enabled"; exit 1; }

          make ARCH=arm64 LLVM=1 CONFIG_FUNCTION_ALIGNMENT=0 prepare
          grep -q '^CONFIG_64BIT=y$' include/config/auto.conf || { echo "CONFIG_64BIT missing from auto.conf"; exit 1; }
          grep -q '^CONFIG_MODULES=y$' include/config/auto.conf || { echo "CONFIG_MODULES missing from auto.conf"; exit 1; }

          make ARCH=arm64 LLVM=1 CONFIG_FUNCTION_ALIGNMENT=0 modules_prepare
          make ARCH=arm64 LLVM=1 CONFIG_FUNCTION_ALIGNMENT=0 kernelrelease > ../kernel-release.txt
          cp .config ../kernel-config.txt

      - name: Build Tango32 module
        run: |
          set -euo pipefail
          make -C kernel M="$GITHUB_WORKSPACE" ARCH=arm64 LLVM=1 CONFIG_FUNCTION_ALIGNMENT=0 CONFIG_TANGO32=m W=1 modules
          test -s tango32.ko

      - name: Collect diagnostics
        if: always()
        run: |
          {
            echo "Kernel repository: ${{ inputs.kernel_repo }}"
            echo "Kernel branch: ${{ inputs.kernel_branch }}"
            echo "Requested device: ${{ inputs.device_model }}"
            echo "Kernel commit:"
            git -C kernel rev-parse HEAD 2>/dev/null || true
            echo "Kernel release:"
            cat kernel-release.txt 2>/dev/null || true
            echo "Compiler:"
            clang --version 2>/dev/null || true
            echo "Module:"
            ls -lh tango32.ko 2>/dev/null || true
          } > build-info.txt
          cp kernel/.config kernel-config.txt 2>/dev/null || true

      - name: Create a separate release for each device model
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          DEVICE_MODEL: ${{ inputs.device_model }}
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        run: |
          set -euo pipefail
          test -s tango32.ko
          KERNEL_COMMIT="$(git -C kernel rev-parse HEAD)"
          KERNEL_SHORT="${KERNEL_COMMIT:0:8}"
          KERNEL_RELEASE="$(cat kernel-release.txt)"
          mkdir -p release-assets
          cp tango32.ko build-info.txt kernel-release.txt kernel-config.txt release-assets/
          tar -czf release-assets/tango32-build-bundle.tar.gz -C release-assets tango32.ko build-info.txt kernel-release.txt kernel-config.txt

          if [ "$DEVICE_MODEL" = "all" ]; then
            : > device-models.txt
            for base in kernel/arch/arm64/boot/dts kernel/arch/arm/boot/dts; do
              [ -d "$base" ] || continue
              while IFS= read -r -d '' file; do
                compatible="$(grep -E '^[[:space:]]*compatible[[:space:]]*=' "$file" | head -n1 || true)"
                printf '%s' "$compatible" | grep -Eiq 'oppo|oplus' || continue
                printf '%s' "$compatible" | grep -Eiq 'oneplus|toradex|valve' && continue
                model="$(grep -Eo '^[[:space:]]*model[[:space:]]*=[[:space:]]*"[^"]+"' "$file" | head -n1 | sed -E 's/^[[:space:]]*model[[:space:]]*=[[:space:]]*"//; s/"$//')"
                [ -n "$model" ] || model="$(basename "$file" .dts)"
                printf '%s\n' "$model" >> device-models.txt
              done < <(find "$base" -type f -name '*.dts' -print0)
            done
            sort -u -o device-models.txt device-models.txt
            if [ ! -s device-models.txt ]; then
              echo "No OPPO/OPlus device models found in DTS files"
              exit 1
            fi
          else
            printf '%s\n' "$DEVICE_MODEL" > device-models.txt
          fi

          while IFS= read -r model || [ -n "$model" ]; do
            [ -n "$model" ] || continue
            model_slug="$(printf '%s' "$model" | sed -E 's/[^A-Za-z0-9]+/-/g; s/^-|-$//g' | tr '[:upper:]' '[:lower:]')"
            release_slug="$(printf '%s' "$KERNEL_RELEASE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9.+_-]+/-/g')"
            tag="tango32-${model_slug}-${release_slug}-${KERNEL_SHORT}"
            title="Tango32 - ${model} - ${KERNEL_RELEASE}"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release already exists: $tag"
              continue
            fi

            notes="$(cat <<EOF
          ## Build details
          - Device model: $model
          - Kernel source: $KERNEL_REPO
          - Branch: $KERNEL_BRANCH
          - Kernel commit: $KERNEL_COMMIT
          - Kernel release: $KERNEL_RELEASE

          ## Compatibility
          Device model was detected from the kernel device-tree source. This module was compiled once for the selected kernel branch, not separately for each listed model. Only load it on a kernel with matching configuration, headers, symbols and toolchain.

          ## Assets
          tango32.ko, kernel configuration, build information and bundle archive.
          EOF
          )"
            gh release create "$tag" release-assets/* --title "$title" --notes "$notes"
            echo "Published: $tag"
          done < device-models.txt

          {
            echo "Detected device models:"
            cat device-models.txt
          } >> build-info.txt

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tango32-compile-check
          path: |
            *.ko
            build-info.txt
            kernel-release.txt
            kernel-config.txt
            device-models.txt
          if-no-files-found: warn
          retention-days: 14
