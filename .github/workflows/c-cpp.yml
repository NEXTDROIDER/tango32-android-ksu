name: Tango32 ARM64 kernel module build

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: Kernel repository (owner/name)
        required: true
        default: oppo-source/android_kernel_oppo_sm6225
        type: string
      kernel_branch:
        description: Kernel branch to compile against
        required: true
        default: oppo/sm6225_b_16.0
        type: string
      delay_minutes:
        description: Optional wait before starting (0-60 minutes)
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Tango32
        uses: actions/checkout@v4

      - name: Optional delay
        env:
          DELAY: ${{ inputs.delay_minutes }}
        run: |
          if ! [[ "$DELAY" =~ ^[0-9]+$ ]] || [ "$DELAY" -gt 60 ]; then
            echo "delay_minutes must be an integer from 0 to 60"
            exit 1
          fi
          if [ "$DELAY" -gt 0 ]; then
            sleep "$((DELAY * 60))"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential git libssl-dev libelf-dev dwarves python3 perl make clang lld llvm

      - name: Clone selected kernel source
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        run: |
          if ! [[ "$KERNEL_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid repo format"
            exit 1
          fi
          git clone --depth=1 --single-branch --branch "$KERNEL_BRANCH" "https://github.com/$KERNEL_REPO.git" kernel
          echo "Kernel commit: $(git -C kernel rev-parse HEAD)"

      - name: Disable missing OPPO vendor Kconfig includes (compile-check only)
        run: |
          cd kernel
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          # Kconfig "source" paths are relative to the kernel tree.
          # Remove only source entries whose referenced file is absent.
          changed_files = []
          missing = []
          for kconfig in root.rglob("Kconfig"):
              try:
                  lines = kconfig.read_text(errors="replace").splitlines()
              except OSError:
                  continue
              out = []
              changed = False
              for line in lines:
                  m = re.match(r'^(\\s*)(source|rsource|osource|orsource)\\s+"([^"]+)"\\s*(?:#.*)?$', line)
                  if not m:
                      out.append(line)
                      continue
                  target = m.group(3)
                  if "$" in target or "*" in target:
                      out.append(line)
                      continue
                  candidate = root / target
                  if not candidate.exists():
                      out.append("# CI compile-check skipped missing Kconfig: " + line.strip())
                      missing.append(f"{kconfig.relative_to(root)}: {target}")
                      changed = True
                  else:
                      out.append(line)
              if changed:
                  kconfig.write_text("\\n".join(out) + "\\n")
                  changed_files.append(str(kconfig.relative_to(root)))
          print("Changed Kconfig files:", changed_files)
          print("Skipped missing includes:", missing)
          if (root / "init/Kconfig").exists():
              print("Remaining OPPO include references:")
              for n, line in enumerate((root / "init/Kconfig").read_text(errors="replace").splitlines(), 1):
                  if "oplus_cpu" in line:
                      print(f"{n}: {line}")
          PY

      - name: Configure ARM64 kernel for compile-check
        run: |
          cd kernel
          make ARCH=arm64 LLVM=1 defconfig
          scripts/config --enable FUTEX
          scripts/config --enable COMPAT
          scripts/config --enable MODULES
          scripts/config --disable MODVERSIONS
          make ARCH=arm64 LLVM=1 olddefconfig
          make ARCH=arm64 LLVM=1 modules_prepare
          make ARCH=arm64 LLVM=1 kernelrelease > ../kernel-release.txt
          grep -E 'CONFIG_(FUTEX|COMPAT|MODULES|MODVERSIONS)=' .config || true
          cp .config ../kernel-config.txt

      - name: Build Tango32 module (compile-check)
        run: |
          make -C kernel M="$GITHUB_WORKSPACE" ARCH=arm64 LLVM=1 CONFIG_TANGO32=m W=1 modules

      - name: Collect diagnostics
        if: always()
        run: |
          {
            echo "Kernel repository: ${{ inputs.kernel_repo }}"
            echo "Kernel branch: ${{ inputs.kernel_branch }}"
            echo "Kernel commit:"
            git -C kernel rev-parse HEAD 2>/dev/null || true
            echo "Kernel release:"
            cat kernel-release.txt 2>/dev/null || true
            echo "Compiler:"
            clang --version 2>/dev/null || true
            echo "Module files:"
            find . -maxdepth 3 -name '*.ko' -print
          } > build-info.txt
          cp kernel/.config kernel-config.txt 2>/dev/null || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tango32-compile-check
          path: |
            *.ko
            build-info.txt
            kernel-release.txt
            kernel-config.txt
          if-no-files-found: warn
          retention-days: 14
