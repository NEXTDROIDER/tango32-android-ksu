name: Tango32 ARM64 kernel module build

run-name: "Tango32 | ${{ inputs.device_model || 'manual' }} | ${{ inputs.kernel_branch || 'default' }}"

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: Kernel repository (owner/name)
        required: true
        default: oppo-source/android_kernel_oppo_sm6225
        type: string
      kernel_branch:
        description: Kernel branch to compile against
        required: true
        default: oppo/sm6225_b_16.0
        type: string
      device_model:
        description: One model, comma-separated model list, or "all" to detect models with Gemini API
        required: true
        default: OPPO CPH2819
        type: string
      delay_minutes:
        description: Optional wait before starting (0-60 minutes)
        required: false
        default: "0"
        type: string

permissions:
  contents: write

concurrency:
  group: tango32-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Tango32
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate workflow inputs
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
          DEVICE_MODEL: ${{ inputs.device_model }}
          DELAY: ${{ inputs.delay_minutes }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$KERNEL_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::Invalid kernel_repo. Use owner/name."; exit 1; }
          [[ -n "$KERNEL_BRANCH" ]] || { echo "::error::kernel_branch cannot be empty."; exit 1; }
          [[ -n "$DEVICE_MODEL" ]] || { echo "::error::device_model cannot be empty."; exit 1; }
          [[ "$DELAY" =~ ^[0-9]+$ ]] && [ "$DELAY" -le 60 ] || { echo "::error::delay_minutes must be 0..60."; exit 1; }

      - name: Optional delay
        env:
          DELAY: ${{ inputs.delay_minutes }}
        run: |
          if ! [[ "$DELAY" =~ ^[0-9]+$ ]] || [ "$DELAY" -gt 60 ]; then
            echo "delay_minutes must be an integer from 0 to 60"
            exit 1
          fi
          if [ "$DELAY" -gt 0 ]; then
            sleep "$((DELAY * 60))"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential git libssl-dev libelf-dev dwarves perl make clang lld llvm jq curl

      - name: Clone selected kernel source
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        run: |
          set -euo pipefail
          if ! [[ "$KERNEL_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid kernel repository format"
            exit 1
          fi
          git clone --depth=1 --single-branch --branch "$KERNEL_BRANCH" "https://github.com/$KERNEL_REPO.git" kernel
          echo "Kernel commit: $(git -C kernel rev-parse HEAD)"

      - name: Disable missing vendor Kconfig includes
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          for file in init/Kconfig drivers/soc/Kconfig mm/Kconfig kernel/Kconfig.locks drivers/power/Kconfig drivers/android/Kconfig drivers/input/Kconfig drivers/input/touchscreen/Kconfig kernel/oplus_cpu/Kconfig; do
            [ -f "$file" ] || continue
            tmp="$(mktemp)"
            while IFS= read -r line || [ -n "$line" ]; do
              trimmed="$(printf '%s' "$line" | sed 's/^[[:space:]]*//')"
              case "$trimmed" in
                source\ *|rsource\ *|osource\ *|orsource\ *)
                  target="$(printf '%s' "$trimmed" | sed -n 's/^[^"]*"\([^"]*\)".*/\1/p')"
                  case "$target" in
                    *'$'*) ;;
                    *)
                      if [ -n "$target" ] && [ ! -f "$target" ]; then
                        printf '# CI skipped missing Kconfig include: %s\n' "$line" >> "$tmp"
                        continue
                      fi
                      ;;
                  esac
                  ;;
              esac
              printf '%s\n' "$line" >> "$tmp"
            done < "$file"
            if ! cmp -s "$file" "$tmp"; then
              cat "$tmp" > "$file"
              echo "Patched missing includes in $file"
            fi
            rm -f "$tmp"
          done

      - name: Configure ARM64 kernel
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          make ARCH=arm64 LLVM=1 defconfig
          scripts/config --enable MODULES
          scripts/config --enable FUTEX
          scripts/config --enable COMPAT
          scripts/config --enable 64BIT
          scripts/config --disable MODVERSIONS
          make ARCH=arm64 LLVM=1 olddefconfig

          grep -q '^CONFIG_64BIT=y$' .config || { echo "CONFIG_64BIT is not enabled"; exit 1; }
          grep -q '^CONFIG_MODULES=y$' .config || { echo "CONFIG_MODULES is not enabled"; exit 1; }

          make ARCH=arm64 LLVM=1 CONFIG_FUNCTION_ALIGNMENT=0 prepare
          grep -q '^CONFIG_64BIT=y$' include/config/auto.conf || { echo "CONFIG_64BIT missing from auto.conf"; exit 1; }
          grep -q '^CONFIG_MODULES=y$' include/config/auto.conf || { echo "CONFIG_MODULES missing from auto.conf"; exit 1; }

          make ARCH=arm64 LLVM=1 CONFIG_FUNCTION_ALIGNMENT=0 modules_prepare
          make ARCH=arm64 LLVM=1 CONFIG_FUNCTION_ALIGNMENT=0 kernelrelease > ../kernel-release.txt
          cp .config ../kernel-config.txt

      - name: Build Tango32 module
        run: |
          set -euo pipefail
          make -C kernel M="$GITHUB_WORKSPACE" ARCH=arm64 LLVM=1 CONFIG_FUNCTION_ALIGNMENT=0 CONFIG_TANGO32=m W=1 modules
          test -s tango32.ko

      - name: Collect diagnostics
        if: always()
        run: |
          {
            echo "Kernel repository: ${{ inputs.kernel_repo }}"
            echo "Kernel branch: ${{ inputs.kernel_branch }}"
            echo "Requested device: ${{ inputs.device_model }}"
            echo "Kernel commit:"
            git -C kernel rev-parse HEAD 2>/dev/null || true
            echo "Kernel release:"
            cat kernel-release.txt 2>/dev/null || true
            echo "Compiler:"
            clang --version 2>/dev/null || true
            echo "Module:"
            ls -lh tango32.ko 2>/dev/null || true
          } > build-info.txt
          cp kernel/.config kernel-config.txt 2>/dev/null || true

      - name: Create a separate release for each device model
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          DEVICE_MODEL: ${{ inputs.device_model }}
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: |
          set -euo pipefail
          test -s tango32.ko
          KERNEL_COMMIT="$(git -C kernel rev-parse HEAD)"
          KERNEL_SHORT="${KERNEL_COMMIT:0:8}"
          KERNEL_RELEASE="$(cat kernel-release.txt)"
          mkdir -p release-assets

          if [ "$DEVICE_MODEL" = "all" ]; then
            if [ -z "${GEMINI_API_KEY:-}" ]; then
              echo "ERROR: Add GEMINI_API_KEY in GitHub Settings > Secrets and variables > Actions."
              exit 1
            fi

            echo "Collecting device identity evidence from the selected kernel source..."
            {
              echo "KERNEL_REPOSITORY=$KERNEL_REPO"
              echo "KERNEL_BRANCH=$KERNEL_BRANCH"
              echo "KERNEL_COMMIT=$KERNEL_COMMIT"
              echo
              echo "=== Device-tree symlinks ==="
              find kernel/arch/arm64/boot/dts kernel/arch/arm/boot/dts -type l -printf '%p -> %l\n' 2>/dev/null || true
              echo
              echo "=== Device identity declarations ==="
              find -L kernel -type d \( -name .git -o -name out -o -name build \) -prune -o -type f \( -name '*.dts' -o -name '*.dtsi' -o -name '*defconfig' -o -name '*.mk' -o -name '*.bp' -o -name '*.product' -o -name '*.prop' -o -name '*.json' -o -name '*.xml' -o -name '*.sh' -o -name 'AndroidProducts.mk' \) -size -2M -print0 |
                while IFS= read -r -d '' file; do
                  matches="$(grep -nI -E '^[[:space:]]*(model|compatible)[[:space:]]*=|qcom,board-id|qcom,msm-id|oplus[,._-]|oppo[,._-]|PRODUCT_(MODEL|DEVICE|NAME|BRAND)|TARGET_(PRODUCT|DEVICE)|ro\.product\.(model|device|name|brand)|CPH[0-9]{4}|P[A-Z0-9]{3,}|PRODUCT_PACKAGES|PRODUCT_MAKEFILES' "$file" 2>/dev/null || true)"
                  if [ -n "$matches" ]; then
                    printf '\n--- %s ---\n%s\n' "$file" "$matches"
                  fi
                done
            } > device-model-evidence.txt

            # Keep the API request bounded using standard shell utilities.
            evidence_bytes="$(wc -c < device-model-evidence.txt)"
            if [ "$evidence_bytes" -gt 180000 ]; then
              { sed -n '1,12p' device-model-evidence.txt; tail -c 179000 device-model-evidence.txt; } > device-model-evidence.trimmed.txt
              mv device-model-evidence.trimmed.txt device-model-evidence.txt
            fi
            test -s device-model-evidence.txt || {
              echo "ERROR: No device identity evidence was found in the kernel checkout."
              exit 1
            }

            cat > gemini-prompt.txt <<'PROMPT'
            You are analyzing Linux/Android kernel source to identify exact OPPO/OPlus smartphone or tablet models supported by THIS source tree.

            Use only the supplied source evidence. Do not guess from the SoC name, do not list generic development boards, and do not invent retail names. A model is eligible only when the evidence explicitly ties that model or its device codename to this kernel source. If evidence only identifies a Qualcomm SoC or generic board, return no device for it.

            Return JSON only, with this exact shape:
            {
              "devices": [
                {
                  "model": "exact device model name as written in source",
                  "codename": "device codename if explicitly present, otherwise empty",
                  "evidence": "short exact identifying text copied from the supplied evidence"
                }
              ]
            }

            Include every distinct OPPO/OPlus phone/tablet model explicitly supported by the evidence. Exclude OnePlus and unrelated vendors. Do not include explanations outside JSON.
          PROMPT
            printf '\n\nSOURCE EVIDENCE:\n' >> gemini-prompt.txt
            cat device-model-evidence.txt >> gemini-prompt.txt

            echo "Asking Gemini (${GEMINI_MODEL}) to identify device models (temperature=0.1)..."
            jq -n --rawfile prompt gemini-prompt.txt '{
              contents: [{ role: "user", parts: [{ text: $prompt }] }],
              generationConfig: {
                temperature: 0.1,
                topP: 0.8,
                candidateCount: 1,
                maxOutputTokens: 4096,
                responseMimeType: "application/json"
              }
            }' > gemini-request.json

            curl --fail --silent --show-error --retry 3 --retry-delay 2 \
              -X POST "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent" \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: ${GEMINI_API_KEY}" \
              --data-binary @gemini-request.json \
              -o gemini-response.json

            gemini_text="$(jq -er '[.candidates[0].content.parts[]?.text // empty] | join("")' gemini-response.json)"
            printf '%s\n' "$gemini_text" > gemini-devices.json
            jq -e '.devices | type == "array"' gemini-devices.json >/dev/null

            : > device-models.txt
            while IFS= read -r item; do
              model="$(jq -r '.model // empty' <<< "$item" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
              evidence_quote="$(jq -r '.evidence // empty' <<< "$item")"
              [ -n "$model" ] || continue
              [ -n "$evidence_quote" ] || {
                echo "Rejected Gemini result without source evidence: $model"
                continue
              }

              # Reject hallucinated model names: the exact model string must occur in kernel evidence.
              if ! grep -Fqi -- "$model" device-model-evidence.txt; then
                echo "Rejected unsupported Gemini model (not present in source evidence): $model"
                continue
              fi
              if ! grep -Fqi -- "$evidence_quote" device-model-evidence.txt; then
                echo "Rejected Gemini model with an unverified evidence quote: $model"
                continue
              fi
              printf '%s\n' "$model" >> device-models.txt
            done < <(jq -c '.devices[]?' gemini-devices.json)

            sort -fu -o device-models.txt device-models.txt
            if [ ! -s device-models.txt ]; then
              echo "ERROR: Gemini found no verifiable OPPO/OPlus phone/tablet models."
              echo "The kernel repository may not include its external vendor device-tree repository."
              echo "Gemini output:"
              cat gemini-devices.json
              exit 1
            fi

            echo "Gemini-identified and source-verified device models:"
            cat device-models.txt
                    else
            # Accept one model or a comma/semicolon/newline-separated model list.
            printf '%s\n' "$DEVICE_MODEL" |
              tr ',;' '\n' |
              sed 's/^[[:space:]]*//; s/[[:space:]]*$//; /^[[:space:]]*$/d' |
              sort -u > device-models.txt
            test -s device-models.txt
          fi

          {
            echo
            echo "Selected device models:"
            cat device-models.txt
            echo "Model detection mode: $([ "$DEVICE_MODEL" = "all" ] && echo Gemini || echo manual)"
          } >> build-info.txt

          cp tango32.ko build-info.txt kernel-release.txt kernel-config.txt release-assets/
          [ ! -f gemini-devices.json ] || cp gemini-devices.json device-model-evidence.txt release-assets/
          tar -czf release-assets/tango32-build-bundle.tar.gz -C release-assets tango32.ko build-info.txt kernel-release.txt kernel-config.txt

          while IFS= read -r model || [ -n "$model" ]; do
            [ -n "$model" ] || continue
            model_slug="$(printf '%s' "$model" | sed -E 's/[^A-Za-z0-9]+/-/g; s/^-|-$//g' | tr '[:upper:]' '[:lower:]')"
            release_slug="$(printf '%s' "$KERNEL_RELEASE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9.+_-]+/-/g')"
            tag="tango32-${model_slug}-${release_slug}-${KERNEL_SHORT}"
            title="Tango32 - ${model} - ${KERNEL_RELEASE}"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release already exists: $tag"
              continue
            fi

            notes="$(cat <<EOF
          ## Build details
          - Device model: $model
          - Kernel source: $KERNEL_REPO
          - Branch: $KERNEL_BRANCH
          - Kernel commit: $KERNEL_COMMIT
          - Kernel release: $KERNEL_RELEASE

          ## Compatibility
          Model selection: $([ "$DEVICE_MODEL" = "all" ] && echo "Gemini analysis with source-evidence checks" || echo "manual workflow input").
          The module was compiled once for the selected kernel branch, not separately for each listed model. A matching model name does not prove binary compatibility; load only on a kernel with matching release, configuration, symbols and toolchain.

          ## Assets
          tango32.ko, kernel configuration, build information and bundle archive.
          EOF
          )"
            gh release create "$tag" release-assets/* --title "$title" --notes "$notes"
            echo "Published: $tag"
          done < device-models.txt

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tango32-compile-check
          path: |
            *.ko
            build-info.txt
            kernel-release.txt
            kernel-config.txt
            device-models.txt
            device-model-evidence.txt
            gemini-devices.json
          if-no-files-found: warn
          retention-days: 14
