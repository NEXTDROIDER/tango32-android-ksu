name: Tango32 Android ARM64 Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential make gcc

      - name: Check repository
        run: |
          ls -la
          find . -maxdepth 2 -type f

      - name: Build
        run: make

      - name: Find output
        run: find . -type f \( -name "*.ko" -o -name "*.o" \)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tango32-build
          path: |
            **/*.ko
            **/*.o
          if-no-files-found: warn
