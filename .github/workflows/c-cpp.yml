name: Tango32 ARM64 kernel module build

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: Kernel repository (owner/name)
        required: true
        default: oppo-source/android_kernel_oppo_sm6225
        type: string
      kernel_branch:
        description: Kernel branch to compile against
        required: true
        default: oppo/sm6225_b_16.0
        type: string
      delay_minutes:
        description: Optional wait before starting (0-60 minutes)
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Tango32
        uses: actions/checkout@v4

      - name: Optional delay
        env:
          DELAY: ${{ inputs.delay_minutes }}
        run: |
          if ! [[ "$DELAY" =~ ^[0-9]+$ ]] || [ "$DELAY" -gt 60 ]; then
            echo "delay_minutes must be an integer from 0 to 60"
            exit 1
          fi
          if [ "$DELAY" -gt 0 ]; then
            sleep "$((DELAY * 60))"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential git libssl-dev libelf-dev dwarves python3 perl make clang lld llvm

      - name: Clone selected kernel source
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        run: |
          if ! [[ "$KERNEL_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid repo format"
            exit 1
          fi
          git clone --depth=1 --single-branch --branch "$KERNEL_BRANCH" "https://github.com/$KERNEL_REPO.git" kernel
          echo "Kernel commit: $(git -C kernel rev-parse HEAD)"

      - name: Disable unavailable OPPO vendor Kconfig entries for compile-check
        run: |
          cd kernel
          python3 - <<'PY'
          from pathlib import Path
          root = Path.cwd()
          # This is a compile-only generic config, so vendor-only menu includes
          # that aren't present in the checkout are commented out.
          files_to_check = [
              root / "init/Kconfig",
              root / "drivers/soc/Kconfig",
              root / "mm/Kconfig",
              root / "kernel/Kconfig.locks",
              root / "drivers/power/Kconfig",
              root / "drivers/android/Kconfig",
              root / "drivers/input/Kconfig",
              root / "drivers/input/touchscreen/Kconfig",
              root / "kernel/oplus_cpu/Kconfig",
          ]
          missing = []
          changed = []
          for p in files_to_check:
              if not p.is_file():
                  continue
              original = p.read_text(errors="replace").splitlines()
              output = []
              touched = False
              for line in original:
                  stripped = line.strip()
                  if stripped.startswith(("source ", "rsource ", "osource ", "orsource ")):
                      q1, q2 = stripped.find('"'), stripped.rfind('"')
                      if q1 != -1 and q2 > q1:
                          target = stripped[q1+1:q2]
                          # Kconfig source paths are relative to kernel root.
                          if not target.startswith("$") and not (root / target).is_file():
                              missing.append(f"{p.relative_to(root)}: {target}")
                              output.append("# CI compile-check: skipped missing vendor include: " + stripped)
                              touched = True
                              continue
                  output.append(line)
              if touched:
                  p.write_text("\n".join(output) + "\n")
                  changed.append(str(p.relative_to(root)))
          print("PATCHED FILES:", changed)
          print("MISSING INCLUDES COMMENTED:", missing)
          # Validate active directives, not the comment text.
          init = root / "init/Kconfig"
          active = []
          if init.exists():
              for line in init.read_text(errors="replace").splitlines():
                  s = line.strip()
                  if s.startswith(("source ", "rsource ", "osource ", "orsource ")) and '"kernel/oplus_cpu/sched/Kconfig"' in s:
                      active.append(line)
          if active:
              print("Still-active missing include:", active)
              raise SystemExit(1)
          PY
          grep -n "oplus_cpu/sched/Kconfig" init/Kconfig || true

      - name: Configure ARM64 kernel for compile-check
        run: |
          cd kernel
          make ARCH=arm64 LLVM=1 defconfig
          scripts/config --enable FUTEX
          scripts/config --enable COMPAT
          scripts/config --enable MODULES
          scripts/config --disable MODVERSIONS
          make ARCH=arm64 LLVM=1 olddefconfig
          make ARCH=arm64 LLVM=1 modules_prepare
          make ARCH=arm64 LLVM=1 kernelrelease > ../kernel-release.txt
          grep -E 'CONFIG_(FUTEX|COMPAT|MODULES|MODVERSIONS)=' .config || true
          cp .config ../kernel-config.txt

      - name: Build Tango32 module (compile-check)
        run: |
          make -C kernel M="$GITHUB_WORKSPACE" ARCH=arm64 LLVM=1 CONFIG_TANGO32=m W=1 modules

      - name: Collect diagnostics
        if: always()
        run: |
          {
            echo "Kernel repository: ${{ inputs.kernel_repo }}"
            echo "Kernel branch: ${{ inputs.kernel_branch }}"
            echo "Kernel commit:"
            git -C kernel rev-parse HEAD 2>/dev/null || true
            echo "Kernel release:"
            cat kernel-release.txt 2>/dev/null || true
            echo "Compiler:"
            clang --version 2>/dev/null || true
            echo "Module files:"
            find . -maxdepth 3 -name '*.ko' -print
          } > build-info.txt
          cp kernel/.config kernel-config.txt 2>/dev/null || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tango32-compile-check
          path: |
            *.ko
            build-info.txt
            kernel-release.txt
            kernel-config.txt
          if-no-files-found: warn
          retention-days: 14
